# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ── H2 in-memory database ───────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 console (handy for manual inspection: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Jackson ─────────────────────────────────────────────────────────────────
# Serialize LocalDate as "2025-01-15" (ISO 8601), not a timestamp array
spring.jackson.serialization.write-dates-as-timestamps=false

# ── AI provider ─────────────────────────────────────────────────────────────
# Set GEMINI_API_KEY as an environment variable to enable the real Gemini
# integration.  When the variable is absent the app uses the built-in mock.
# NEVER commit an actual key here.
# GEMINI_API_KEY=
